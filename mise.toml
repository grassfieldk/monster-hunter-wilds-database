[tools]
node = "24.19.0"

[tasks.setup]
description = "依存パッケージをインストール"
run = "npm install"

[tasks.dev]
description = "開発サーバーを起動"
run = "npm run dev"

[tasks.build]
description = "公開用ファイルを生成"
run = "npm run build"

[tasks.data]
description = "ゲームデータからサイト用データを生成"
run = "node scripts/extract-game-data.mjs"

[tasks.official-events]
description = "公式イベントクエストを追加"
run = "node scripts/import-official-event-quests.mjs"

[tasks.clean]
description = "作業用の生成物を削除"
run = "npm run clean"
